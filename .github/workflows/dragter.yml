name: Find dragter (Wikimedia Commons)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y imagemagick >/dev/null
      - run: node src/dragter-commons.mjs
      - name: Læg resultatet på grenen dragter-tjek
        run: |
          cd tjek
          git init -q -b dragter-tjek
          git config user.name "github-actions[bot]"
          git config user.email "41898338+github-actions[bot]@users.noreply.github.com"
          git add dragter.json dragter-indeks.json dragter-ark-*.jpg && git commit -qm "Dragter fra Commons"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dragter-tjek
