name: Byg og udgiv Dagens Fugl

on:
  schedule:
    # Lige efter midnat dansk tid – både sommer- og vintertid (GitHub bruger UTC).
    - cron: '7 22 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:
    inputs:
      max_fetch:
        description: 'Hvor mange arter der højst hentes data for (første gang: 700)'
        default: '60'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dagens-fugl
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find sidens adresse
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "SITE_URL=${{ vars.SITE_URL }}" >> "$GITHUB_ENV"
          else
            owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "SITE_URL=https://${owner}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Hent data fra kilderne
        env:
          # Skriv [hent-alle] i en commit-besked for at hente data for alle arter ved et push
          MAX_FETCH: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[hent-alle]') && '700' || '0') || inputs.max_fetch || '60' }}
          # Ugentlig opdatering af GBIF-fund – ikke ved almindelige push.
          GBIF_FETCH: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[hent-alle]') && '800' || '0') || '200' }}
          ALLOW_NONCOMMERCIAL: ${{ vars.ALLOW_NONCOMMERCIAL || 'true' }}
          CONTACT: ${{ vars.CONTACT }}
          XC_KEY: ${{ secrets.XC_KEY }}
        run: node src/fetch-data.mjs

      - name: Gem hentede data i repoet
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > data/last-build.txt
          git config user.name "dagens-fugl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Opdater fugledata [skip ci]"
          for i in 1 2 3 4; do git push && break; echo "Push afvist – henter nye ændringer og prøver igen ($i)"; git pull --rebase -X theirs origin main || git rebase --abort; sleep 5; done

      - name: Byg siden
        env:
          ALLOW_NONCOMMERCIAL: ${{ vars.ALLOW_NONCOMMERCIAL || 'true' }}
          OWNER_NAME: ${{ vars.OWNER_NAME }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CF_BEACON: ${{ vars.CF_BEACON }}
          SIGNUP_URL: ${{ vars.SIGNUP_URL }}
        run: node src/build.mjs

      - name: Gem rækkefølgen for dagens fugl
        run: |
          git add data/raekkefoelge.json
          git diff --cached --quiet || { git commit -m "Opdater rækkefølge [skip ci]" && for i in 1 2 3 4; do git push && break; git pull --rebase -X theirs origin main || git rebase --abort; sleep 5; done; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
