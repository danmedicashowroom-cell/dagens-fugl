name: Tjek fotos (æg, fjer, reder)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tjek:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y imagemagick >/dev/null
      - run: node src/build.mjs
        env:
          SITE_URL: https://dagensfugl.dk
      - run: node src/foto-tjek.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: foto-tjek
          path: |
            tjek/annoteret.json
            tjek/indeks.json
            tjek/ark-*.jpg
